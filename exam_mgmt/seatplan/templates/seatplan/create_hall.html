{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Create Hall</title>
    <link rel="stylesheet" href="{% static 'seatplan/css/main.css' %}">
</head>
<body>
<div class="navbar">
    <span class="navbar-title">Create Hall</span>
    <div class="navbar-actions">
        <button id="themeToggle" class="theme-toggle-btn"><span class="theme-icon">🌙</span></button>
        <a href="{% url 'seatplan_home' %}" class="back-link">← Back</a>
    </div>
</div>
<div class="container">
    <div class="page-header">
        <h1>Create Hall</h1>
        <p class="page-description">Add a new hall with rows and columns.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Create</button>
        <a class="btn" href="{% url 'seatplan_manage_halls' %}">Cancel</a>
    </form>
</div>

<script src="{% static 'seatplan/js/theme.js' %}"></script>
</body>
</html>
